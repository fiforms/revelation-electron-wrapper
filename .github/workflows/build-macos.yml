name: build-macos

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64:
    name: macos-arm64
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ensure Homebrew
        run: |
          if ! command -v brew >/dev/null 2>&1; then
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          if [ -x /opt/homebrew/bin/brew ]; then
            eval "$(/opt/homebrew/bin/brew shellenv)"
          elif [ -x /usr/local/bin/brew ]; then
            eval "$(/usr/local/bin/brew shellenv)"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --include=optional

      - name: Run tests (Apple Silicon)
        run: npm run tests:ci

      - name: Upload test results (Apple Silicon)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-macos-arm64
          path: test-results/
          if-no-files-found: warn

      - name: Build PopplerPDF payload (Apple Silicon)
        run: npm run build-popplerpdf-mac -- --arch=arm64

      - name: Build (Apple Silicon)
        run: npm run dist-mac -- --publish never
        env:
          SKIP_BUILD_TESTS: "1"

      - name: PopplerPDF plugin SHA-256 (Apple Silicon)
        run: shasum -a 256 dist/PopplerPDF.Plugin.*.zip

      - name: Upload DMG (Apple Silicon)
        uses: actions/upload-artifact@v4
        with:
          name: revelaton-macos-arm64-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Upload PopplerPDF plugin (Apple Silicon)
        uses: actions/upload-artifact@v4
        with:
          name: popplerpdf-plugin-macos-arm64
          path: dist/PopplerPDF.Plugin.*.macOS-arm64.zip
          if-no-files-found: error

  macos-x64:
    name: macos-x64
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ensure Homebrew
        run: |
          if ! command -v brew >/dev/null 2>&1; then
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          eval "$(/usr/local/bin/brew shellenv)"

      - name: Install gettext
        run: |
          brew install gettext
          brew link --force gettext || true
          ls -l /usr/local/opt/gettext/lib/libintl.8.dylib

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --include=optional

      - name: Run tests (Intel)
        run: npm run tests:ci

      - name: Upload test results (Intel)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-macos-x64
          path: test-results/
          if-no-files-found: warn

      - name: Build PopplerPDF payload (Intel)
        run: npm run build-popplerpdf-mac -- --arch=x64

      - name: Build (Intel)
        run: npm run dist-mac-intel -- --publish never
        env:
          SKIP_BUILD_TESTS: "1"

      - name: PopplerPDF plugin SHA-256 (Intel)
        run: shasum -a 256 dist/PopplerPDF.Plugin.*.zip

      - name: Upload DMG (Intel)
        uses: actions/upload-artifact@v4
        with:
          name: revelaton-macos-x64-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Upload PopplerPDF plugin (Intel)
        uses: actions/upload-artifact@v4
        with:
          name: popplerpdf-plugin-macos-x64
          path: dist/PopplerPDF.Plugin.*.macOS-x64.zip
          if-no-files-found: error

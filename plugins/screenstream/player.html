<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen Stream</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    #status { position: fixed; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center;
      font: 20px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #6c7086; pointer-events: none; }
  </style>
</head>
<body>
  <video id="video" muted autoplay playsinline></video>
  <div id="status">Waiting for the screen stream…</div>
  <script src="player.js"></script>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title data-translate>Read the Bible</title>
  <style>
    .bible-read-root {
      background: #111;
      color: #eee;
      font-family: system-ui, sans-serif;
      padding: 1.25rem;
      box-sizing: border-box;
      min-height: 100vh;
    }
    .bible-read-root h2 {
      margin: 0;
    }
    .bible-read-root .read-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin: 0 0 1rem;
    }
    .bible-read-root .read-header button {
      width: auto;
    }
    .bible-read-root .read-header .header-buttons {
      display: flex;
      gap: 0.5rem;
    }
    .bible-copyright-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .bible-copyright-backdrop[hidden] { display: none; }
    .bible-copyright-dialog {
      background: #1b1d23;
      color: #eee;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 1.1rem 1.3rem;
      width: min(40rem, 90vw);
      max-height: 80vh;
      overflow-y: auto;
      font-family: system-ui, sans-serif;
    }
    .bible-copyright-dialog h3 { margin: 0 0 0.8rem; }
    .bible-copyright-dialog dt { color: #aaa; font-size: 0.85rem; margin-top: 0.7rem; }
    .bible-copyright-dialog dd { margin: 0.15rem 0 0; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
    .bible-copyright-dialog .actions { margin-top: 1rem; text-align: right; }
    .bible-copyright-dialog button {
      padding: 0.45rem 1rem;
      border: none;
      border-radius: 4px;
      background: #0078d7;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    .bible-read-root .controls {
      display: grid;
      grid-template-columns: repeat(3, minmax(140px, 1fr));
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }
    .bible-read-root .controls.secondary {
      grid-template-columns: 1fr auto auto auto;
      align-items: end;
      margin-bottom: 0.2rem;
    }
    .bible-read-root label {
      display: block;
      margin-bottom: 0.3rem;
      font-size: 0.92rem;
    }
    .bible-read-root input,
    .bible-read-root select,
    .bible-read-root button {
      width: 100%;
      box-sizing: border-box;
      padding: 0.5rem;
      border-radius: 4px;
      border: 1px solid #555;
      background: #222;
      color: #eee;
    }
    .bible-read-root button {
      cursor: pointer;
      background: #0078d7;
      border: none;
      font-weight: 600;
      min-width: 112px;
    }
    .bible-read-root button.secondary {
      background: #2f3440;
      border: 1px solid #555;
    }
    .bible-read-root .chapter-heading-row {
      display: flex;
      align-items: baseline;
      gap: 0.55rem;
      margin: 0.1rem 0 0.4rem;
    }
    .bible-read-root .chapter-header {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 700;
    }
    .bible-read-root .meta {
      margin: 0;
      color: #b6bfd0;
      font-size: 0.9rem;
    }
    .bible-read-root .status {
      margin: 0 0 0.25rem;
      color: #f0c674;
      min-height: 0;
    }
    .bible-read-root .chapter {
      border: 1px solid #333;
      background: #171717;
      border-radius: 8px;
      padding: 1rem;
      max-height: calc(100vh - 290px);
      overflow: auto;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .bible-read-root .verse {
      display: block;
      margin-bottom: 0.4rem;
    }
    .bible-read-root .verse.highlight {
      background: rgba(127, 184, 255, 0.14);
      border-radius: 4px;
      padding: 0.2rem 0.35rem;
      margin-left: -0.35rem;
      margin-right: -0.35rem;
    }
    .bible-read-root .verse-num {
      color: #7fb8ff;
      font-weight: 700;
      margin-right: 0.35rem;
    }
    .bible-read-root .verse-present {
      width: auto;
      min-width: 0;
      display: inline-block;
      padding: 0 0.4rem;
      margin-right: 0.35rem;
      font-size: 0.8rem;
      line-height: 1.4;
      vertical-align: baseline;
      background: #2f3440;
      border: 1px solid #555;
      border-radius: 4px;
      color: #7fb8ff;
      cursor: pointer;
    }
    .bible-read-root .verse-present:hover {
      background: #0078d7;
      color: #fff;
    }
    .bible-read-root button#clearBtn {
      background: #5a2f2f;
      border: 1px solid #804040;
    }
    .bible-read-root .verse-ref-link {
      color: #7fb8ff;
      font-weight: 700;
      margin-right: 0.35rem;
      text-decoration: underline;
      text-decoration-color: rgba(127, 184, 255, 0.5);
    }
    .bible-read-root .verse-ref-link:hover {
      text-decoration-color: rgba(127, 184, 255, 0.95);
    }
    @media (max-width: 900px) {
      .bible-read-root .controls {
        grid-template-columns: 1fr;
      }
      .bible-read-root .controls.secondary {
        grid-template-columns: 1fr;
      }
      .bible-read-root .chapter {
        max-height: none;
      }
    }
  </style>
  <link rel="stylesheet" href="/admin/sidebar.css" />
</head>
<body>
  <div class="bible-read-root">
  <div class="read-header">
    <h2>📖 <span data-translate>Read the Bible</span></h2>
    <div class="header-buttons">
      <button id="copyrightBtn" type="button" class="secondary" data-translate>Copyright</button>
      <button id="bibleDownloadsBtn" type="button" class="secondary" data-translate>Bible Downloads</button>
    </div>
  </div>

  <div class="controls">
    <div>
      <label for="translation" data-translate>Translation (Local)</label>
      <select id="translation"></select>
    </div>
    <div>
      <label for="book" data-translate>Book</label>
      <select id="book"></select>
    </div>
    <div>
      <label for="chapter" data-translate>Chapter</label>
      <select id="chapter"></select>
    </div>
  </div>

  <div class="controls secondary">
    <div>
      <input id="reference" data-translate-placeholder placeholder="Enter chapter reference" />
    </div>
    <button id="prevBtn" class="secondary" data-translate>Previous Chapter</button>
    <button id="nextBtn" class="secondary" data-translate>Next Chapter</button>
    <button id="clearBtn" data-translate>Clear Screen</button>
  </div>

  <div class="status" id="status"></div>
  <div class="chapter-heading-row">
    <div class="chapter-header" id="chapterHeader"></div>
    <div class="meta" id="chapterMeta"></div>
  </div>
  <div class="chapter" id="chapterText" data-translate>Choose a translation and chapter to begin.</div>

  <div class="bible-copyright-backdrop" id="copyrightBackdrop" hidden>
    <div class="bible-copyright-dialog" role="dialog" aria-modal="true" aria-labelledby="copyrightTitle">
      <h3 id="copyrightTitle"></h3>
      <dl id="copyrightFields"></dl>
      <div class="actions"><button type="button" id="copyrightClose" data-translate>Close</button></div>
    </div>
  </div>

  <script src="/js/translate.js"></script>
  <script src="read.js"></script>
  <script src="/admin/sidebar.js"></script>
  </div>
</body>
</html>

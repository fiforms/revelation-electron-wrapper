<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title data-translate>New Presentation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="/css/presentations.css" />
  <link rel="stylesheet" href="/admin/create-edit.css" />
</head>
<body>
  <div class="app-header">
    <div class="app-header-title">
      <h1 data-translate>Create New Presentation</h1>
    </div>
    <button id="metadata-help-btn" type="button" title="Help">❔</button>
  </div>

  <div class="tab-container-wrapper">
    <div class="tabs-container">
      <div class="tabs-header" role="tablist">
        <button class="tab-button" role="tab" aria-selected="true" aria-controls="tab-presentation" data-tab="presentation" data-translate="true">Presentation</button>
        <button class="tab-button" role="tab" aria-selected="false" aria-controls="tab-theme" data-tab="theme" data-translate="true">Theme</button>
        <button class="tab-button" role="tab" aria-selected="false" aria-controls="tab-setup" data-tab="setup" data-translate="true">Setup</button>
        <button class="tab-button" role="tab" aria-selected="false" aria-controls="tab-advanced" data-tab="advanced" data-translate="true">Advanced</button>
        <button class="tab-button" role="tab" aria-selected="false" aria-controls="tab-media" data-tab="media" data-translate="true">Media</button>
        <button class="tab-button" role="tab" aria-selected="false" aria-controls="tab-macros" data-tab="macros" data-translate="true">Macros</button>
        <button class="tab-button" role="tab" aria-selected="false" aria-controls="tab-imports" data-tab="imports" data-translate="true">Imports</button>
      </div>

      <form id="create-form">
        <div id="tab-presentation" class="tab-content" role="tabpanel" aria-labelledby="tab-presentation-btn"></div>
        <div id="tab-theme" class="tab-content" role="tabpanel" aria-labelledby="tab-theme-btn" hidden></div>
        <div id="tab-setup" class="tab-content" role="tabpanel" aria-labelledby="tab-setup-btn" hidden></div>
        <div id="tab-advanced" class="tab-content" role="tabpanel" aria-labelledby="tab-advanced-btn" hidden></div>
        <div id="tab-media" class="tab-content" role="tabpanel" aria-labelledby="tab-media-btn" hidden></div>
        <div id="tab-macros" class="tab-content" role="tabpanel" aria-labelledby="tab-macros-btn" hidden></div>
        <div id="tab-imports" class="tab-content" role="tabpanel" aria-labelledby="tab-imports-btn" hidden></div>
        <div class="form-buttons"></div>
      </form>
    </div>
  </div>

  <div id="result"></div>

  <!-- create.js builds the whole form from presentation-schema.json; see the header comment in create.js. -->
  <script type="module" src="/admin/create.js"></script>
  <script src="/js/translate.js"></script>
</body>
</html>
